<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Toko Online Teknologi Dhea</title>
  <style>
    :root {
      --primary: #ff9eb5;
      --primary-dark: #e57492;
      --primary-light: #fff0f5;
      --accent: #f8c6d8;
      --bg1: #ffe6f0;
      --bg2: #ffd6e8;
      --text: #4a2c3b;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 30px;
      background: linear-gradient(-45deg, var(--bg1), var(--bg2), #fff0f5, #ffe6f2);
      background-size: 400% 400%;
      animation: gradientMove 12s ease infinite;
      color: var(--text);
    }

    @keyframes gradientMove {
      0% {background-position: 0% 50%;}
      50% {background-position: 100% 50%;}
      100% {background-position: 0% 50%;}
    }

    .container {
      max-width: 1100px;
      margin: auto;
      background-color: #fff;
      padding: 35px;
      border-radius: 15px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
      animation: fadeIn 0.9s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      text-align: center;
      color: var(--primary-dark);
      margin-bottom: 25px;
      font-size: 28px;
    }

    h2 {
      margin-top: 30px;
      color: var(--text);
      border-left: 5px solid var(--primary);
      padding-left: 12px;
      font-size: 20px;
    }

    /* Tabel */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(0,0,0,0.05);
    }

    th, td {
      padding: 14px 16px;
      text-align: left;
      font-size: 15px;
    }

    th {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    tr:nth-child(even) {
      background-color: #fff6fa;
    }

    tr:hover {
      background-color: var(--primary-light);
      transition: 0.3s;
    }

    /* Grid Form */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 25px;
    }

    .form-section {
      background-color: var(--primary-light);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.05);
      animation: fadeIn 1s ease-in-out;
    }

    .form-section h3 {
      margin-top: 0;
      color: var(--primary-dark);
      margin-bottom: 15px;
      font-size: 18px;
    }

    input, select {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border: 1px solid #f2c5d6;
      border-radius: 8px;
      font-size: 14px;
      box-sizing: border-box;
      transition: border-color 0.3s ease;
    }

    input:focus, select:focus {
      border-color: var(--primary);
      outline: none;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      color: white;
      cursor: pointer;
      font-size: 15px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      transition: transform 0.2s ease, opacity 0.3s ease;
    }

    button:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }


    .ringkasan {
      margin-top: 35px;
      padding: 20px;
      background: #fff;
      border: 2px dashed var(--primary);
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      max-width: 420px;
      margin-left: auto;
      margin-right: auto;
      animation: fadeIn 0.8s ease-in-out;
    }

    .ringkasan h3 {
      margin-top: 0;
      color: var(--primary-dark);
      font-size: 20px;
      margin-bottom: 15px;
      text-align: center;
    }

    .ringkasan p {
      margin: 8px 0;
      font-size: 15px;
      text-align: left;
    }

    .ringkasan strong {
      display: inline-block;
      width: 140px;
      color: var(--primary-dark);
    }

    .ringkasan .total {
      border-top: 2px dashed var(--primary-dark);
      margin-top: 15px;
      padding-top: 12px;
      font-size: 17px;
      font-weight: bold;
      color: var(--primary-dark);
      text-align: left;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🛍️ Manajemen Toko Dhea 🛍️ </h1>


    <h2>Daftar Produk</h2>
    <table id="tabelProduk">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nama</th>
          <th>Harga</th>
          <th>Stok</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <!-- Manajemen Produk -->
    <div class="form-grid">
      <div class="form-section">
        <h3>Tambah Produk</h3>
        <input type="text" id="namaProduk" placeholder="Nama Produk">
        <input type="number" id="hargaProduk" placeholder="Harga">
        <input type="number" id="stokProduk" placeholder="Stok">
        <button onclick="tambahProduk()">+ Tambah Produk</button>
      </div>

      <div class="form-section">
        <h3>Hapus Produk</h3>
        <input type="number" id="hapusId" placeholder="ID Produk">
        <button onclick="hapusProduk()">🗑️ Hapus Produk</button>
      </div>
    </div>

    <!-- Pesanan -->
    <h2>Pelanggan & Pesanan</h2>
    <div class="form-section">
      <h3>Buat Pesanan</h3>
      <input type="text" id="namaPelanggan" placeholder="Nama Pelanggan">
      <select id="pilihProduk"></select>
      <input type="number" id="jumlahPesanan" placeholder="Jumlah">
      <button onclick="buatPesanan()">✔️ Buat Pesanan</button>
    </div>

    <!-- Ringkasan -->
    <div class="ringkasan" id="ringkasanPesanan" style="display:none;">
        <h3>🧾 Ringkasan Pesanan</h3>
        <p><strong>Nama Pelanggan:</strong> <span id="rNama"></span></p>
        <p><strong>Produk:</strong> <span id="rProduk"></span></p>
        <p><strong>Jumlah:</strong> <span id="rJumlah"></span></p>
        <div class="total">
          <p><strong>Total Bayar:</strong> <span id="rTotal"></span></p>
        </div>
    </div>

    <!-- Riwayat Pesanan -->
    <h2>📜 Riwayat Pesanan</h2>
    <table id="tabelRiwayat">
      <thead>
        <tr>
          <th>Nama Pelanggan</th>
          <th>Produk</th>
          <th>Jumlah</th>
          <th>Total</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script>
   let produkToko = [
      { id: 1, nama: "Laptop", harga: 7000000, stok: 5 },
      { id: 2, nama: "Mouse", harga: 200000, stok: 10 },
      { id: 3, nama: "Keyboard", harga: 350000, stok: 7 }
    ];

    let riwayatPesanan = [];

    function tampilkanProduk() {
      const tbody = document.querySelector("#tabelProduk tbody");
      const select = document.getElementById("pilihProduk");
      tbody.innerHTML = "";
      select.innerHTML = "<option value=''>-- Pilih Produk --</option>";

      produkToko.forEach(prod => {
        tbody.innerHTML += `
          <tr>
            <td>${prod.id}</td>
            <td>${prod.nama}</td>
            <td>Rp${prod.harga.toLocaleString('id-ID')}</td>
            <td>${prod.stok}</td>
          </tr>
        `;
        select.innerHTML += `<option value="${prod.id}">${prod.nama} - Rp${prod.harga.toLocaleString('id-ID')}</option>`;
      });
    }

    function tampilkanRiwayat() {
      const tbody = document.querySelector("#tabelRiwayat tbody");
      tbody.innerHTML = "";
      riwayatPesanan.forEach(p => {
        tbody.innerHTML += `
          <tr>
            <td>${p.nama}</td>
            <td>${p.produk}</td>
            <td>${p.jumlah}</td>
            <td>Rp${p.total.toLocaleString('id-ID')}</td>
          </tr>
        `;
      });
    }

    function tambahProduk() {
      const nama = document.getElementById("namaProduk").value;
      const harga = parseInt(document.getElementById("hargaProduk").value);
      const stok = parseInt(document.getElementById("stokProduk").value);

      if (!nama || isNaN(harga) || isNaN(stok) || harga <= 0 || stok <= 0) {
        alert("Harap isi semua data dengan benar!");
        return;
      }

      const idBaru = produkToko.length > 0 ? produkToko[produkToko.length - 1].id + 1 : 1;
      produkToko.push({ id: idBaru, nama, harga, stok });
      tampilkanProduk();

      document.getElementById("namaProduk").value = "";
      document.getElementById("hargaProduk").value = "";
      document.getElementById("stokProduk").value = "";
    }

    function hapusProduk() {
      const id = parseInt(document.getElementById("hapusId").value);
      const index = produkToko.findIndex(prod => prod.id === id);

      if (index !== -1) {
        produkToko.splice(index, 1);
        tampilkanProduk();
        alert("Produk berhasil dihapus!");
      } else {
        alert("Produk dengan ID " + id + " tidak ditemukan.");
      }

      document.getElementById("hapusId").value = "";
    }

    function buatPesanan() {
      const nama = document.getElementById("namaPelanggan").value;
      const idProduk = parseInt(document.getElementById("pilihProduk").value);
      const jumlah = parseInt(document.getElementById("jumlahPesanan").value);

      const produk = produkToko.find(p => p.id === idProduk);

      if (!nama || !produk || isNaN(jumlah) || jumlah <= 0) {
        alert("Harap isi semua data pesanan dengan benar!");
        return;
      }

      if (jumlah > produk.stok) {
        alert("Stok tidak mencukupi!");
        return;
      }

      const total = produk.harga * jumlah;
      produk.stok -= jumlah;
      tampilkanProduk();

      // update ringkasan
      document.getElementById("rNama").innerText = nama;
      document.getElementById("rProduk").innerText = produk.nama;
      document.getElementById("rJumlah").innerText = jumlah;
      document.getElementById("rTotal").innerText = "Rp" + total.toLocaleString('id-ID');
      document.getElementById("ringkasanPesanan").style.display = "block";

      // simpan ke riwayat
      riwayatPesanan.push({ nama, produk: produk.nama, jumlah, total });
      tampilkanRiwayat();

      // reset form
      document.getElementById("namaPelanggan").value = "";
      document.getElementById("pilihProduk").value = "";
      document.getElementById("jumlahPesanan").value = "";
    }

    tampilkanProduk();
  </script>
</body>
</html>
